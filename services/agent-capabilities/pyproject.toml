[project]
name = "agent-capabilities"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "anyio>=4.9,<5",
  "mcp==1.28.1",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-sdk>=1.38,<2",
  "pydantic-settings>=2.10,<3",
  "pymysql>=1.1,<2",
  "redis[hiredis]>=6.4,<7",
  "sentence-transformers>=5,<6",
  "sqlalchemy>=2.0.41,<3",
  "starlette>=0.47,<1",
  "uvicorn[standard]>=0.35,<1"
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "testcontainers[mysql,redis]>=4.10,<5"
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_capabilities"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires Redis or MySQL containers",
  "quality: requires the real local MiniLM model"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
